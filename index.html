<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playtest Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <header class="site-header">
      <div class="header-top">
        <div>
          <p class="brand">Playtest Games</p>
          <p class="tagline">Open builds looking for players. Pick a card, jump in.</p>
        </div>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="status" id="status" aria-live="polite">Loading playtests…</section>
      <section class="listings" id="grid" hidden></section>
    </main>

    <dialog class="modal" id="modal" aria-labelledby="modal-title">
      <article class="modal-card">
        <header class="modal-header">
          <button type="button" class="modal-close" id="modal-close" aria-label="Close">
            ×
          </button>
          <div class="modal-badges" id="modal-badges"></div>
          <h2 class="modal-title" id="modal-title"></h2>
          <div class="modal-meta" id="modal-meta"></div>
          <div class="modal-header-actions" id="modal-header-actions"></div>
        </header>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-actions"></div>
      </article>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
